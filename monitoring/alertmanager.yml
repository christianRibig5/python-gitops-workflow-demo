global:
  resolve_timeout: 5m

route:
  receiver: lab-null
  group_by: ["alertname", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

# Lab stage: alerts appear in the Alertmanager UI, but no notifications
# are sent until you configure a real receiver with secrets outside Git.
receivers:
  - name: lab-null
