apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  type: ClusterIP

  selector:
    app: alertmanager

  ports:
    - name: http
      protocol: TCP
      port: 9093
      targetPort: http
