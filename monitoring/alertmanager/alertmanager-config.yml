global:
  resolve_timeout: 5m
  smtp_smarthost: "smtppro.zoho.com:587"
  smtp_from: "systems@vgc247.com"
  smtp_auth_username: "systems@vgc247.com"
  smtp_auth_password_file: "/mnt/secrets-store/zoho-smtp-password"
  smtp_require_tls: true

route:
  receiver: default-email
  group_by:
    - alertname
    - job
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - receiver: warning-email
      matchers:
        - severity="warning"

    - receiver: critical-email
      matchers:
        - severity="critical"
      repeat_interval: 1h

receivers:
  - name: default-email
    email_configs:
      - to: "info@christianonyeukwu.com"
        send_resolved: true

  - name: warning-email
    email_configs:
      - to: "info@jalexsolutions.com"
        send_resolved: true

  - name: critical-email
    email_configs:
      - to: "systems@vgc247.com, info@jalexsolutions.com, info@christianonyeukwu.com"
        send_resolved: true
