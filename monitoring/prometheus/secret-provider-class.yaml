apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass

metadata:
  name: prometheus-grafana-cloud-token
  namespace: monitoring

spec:
  provider: aws
  parameters:
    region: ca-central-1
    usePodIdentity: "true"
    objects: |
      - objectName: "dev/monitoring/prometheus/grafana-cloud-token"
        objectType: "secretsmanager"
        objectAlias: "password"
        filePermission: "0440"
