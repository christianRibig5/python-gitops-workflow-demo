apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring

spec:
  replicas: 1

  # Suitable for a single ReadWriteOnce EBS volume.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: prometheus

  template:
    metadata:
      labels:
        app: prometheus

    spec:
      serviceAccountName: prometheus-sa
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.3
          imagePullPolicy: IfNotPresent

          args:
            - "--config.file=/etc/prometheus/config/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=3d"

          ports:
            - name: http
              containerPort: 9090
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/config
              readOnly: true

            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true

            - name: data
              mountPath: /prometheus

            - name: grafana-cloud-credentials
              mountPath: /etc/prometheus/grafana-cloud
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: prometheus-config

        - name: rules
          configMap:
            name: prometheus-rules

        # EBS-backed storage preserves history across Pod replacements.
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
        - name: grafana-cloud-credentials
          secret:
            secretName: grafana-cloud-credentials
            items:
              - key: password
                path: password
