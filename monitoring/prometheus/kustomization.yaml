apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - service-account.yaml
  - rbac.yaml
  - storage-class.yaml
  - persistent-volume-claim.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml=config.yml

  - name: prometheus-rules
    files:
      - alerts.yml=alert-rules.yml
