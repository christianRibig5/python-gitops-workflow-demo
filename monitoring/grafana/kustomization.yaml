apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - service-account.yaml
  - secret-provider-class.yaml
  - persistent-volume-claim.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

configMapGenerator:
  - name: grafana-datasources
    files:
      - datasource.yaml=datasource.yaml
