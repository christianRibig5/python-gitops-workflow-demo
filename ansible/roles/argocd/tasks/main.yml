- name: Verify AWS authentication
  ansible.builtin.command:
    cmd: aws sts get-caller-identity --profile {{ aws_profile }}
  changed_when: false

- name: Update EKS kubeconfig
  ansible.builtin.command:
    cmd: >
      aws eks update-kubeconfig
      --region {{ aws_region }}
      --name {{ eks_cluster_name }}
      --profile {{ aws_profile }}
  changed_when: true

- name: Confirm access to EKS worker nodes
  ansible.builtin.command:
    cmd: kubectl get nodes
  register: eks_nodes
  changed_when: false

- name: Display EKS nodes
  ansible.builtin.debug:
    var: eks_nodes.stdout_lines

- name: Create Argo CD namespace
  kubernetes.core.k8s:
    name: "{{ argocd_namespace }}"
    api_version: v1
    kind: Namespace
    state: present

- name: Install Argo CD
  ansible.builtin.command:
    cmd: >
      kubectl apply
      --namespace {{ argocd_namespace }}
      --server-side
      --force-conflicts
      --filename
      https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml
  register: argocd_install
  changed_when: >
    'created' in argocd_install.stdout or
    'configured' in argocd_install.stdout or
    'serverside-applied' in argocd_install.stdout

- name: Wait for Argo CD to become ready
  ansible.builtin.command:
    argv:
      - kubectl
      - rollout
      - status
      - deployment/argocd-server
      - --namespace={{ argocd_namespace }}
      - --timeout=300s
  changed_when: false

- name: Create Argo CD dashboard ingress
  kubernetes.core.k8s:
    state: present
    src: "{{ playbook_dir }}/../argocd/argocd-ingress.yaml"

- name: Register application with Argo CD
  kubernetes.core.k8s:
    state: present
    namespace: "{{ argocd_namespace }}"
    src: "{{ playbook_dir }}/../argocd/application.yaml"

