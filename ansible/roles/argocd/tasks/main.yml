---
# ============================================================
# Argo CD Role
#
# Purpose:
# Install and configure Argo CD on the shared EKS cluster,
# then register the project's GitOps applications.
#
# Dependencies:
# - Preflight checks completed
# - kubeconfig configured
# - EKS cluster reachable
# - Project Terraform completed
# ============================================================

# ------------------------------------------------------------
# Namespace
# ------------------------------------------------------------

- name: Ensure Argo CD namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ argocd_namespace }}"
    state: present

# ------------------------------------------------------------
# Install Argo CD
# ------------------------------------------------------------

- name: Install Argo CD
  ansible.builtin.command:
    argv:
      - kubectl
      - apply
      - --namespace
      - "{{ argocd_namespace }}"
      - --server-side
      - --force-conflicts
      - --filename
      - "https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml"
  register: argocd_install
  changed_when: >
    'created' in argocd_install.stdout or
    'configured' in argocd_install.stdout or
    'serverside-applied' in argocd_install.stdout

# ------------------------------------------------------------
# CRD Readiness
# ------------------------------------------------------------

- name: Wait for Argo CD Application CRD
  ansible.builtin.command:
    argv:
      - kubectl
      - wait
      - --for=condition=Established
      - crd/applications.argoproj.io
      - --timeout=120s
  changed_when: false

# ------------------------------------------------------------
# Argo CD Workload Readiness
# ------------------------------------------------------------

- name: Wait for Argo CD server
  ansible.builtin.command:
    argv:
      - kubectl
      - rollout
      - status
      - deployment/argocd-server
      - "--namespace={{ argocd_namespace }}"
      - --timeout=300s
  changed_when: false

- name: Wait for Argo CD repo server
  ansible.builtin.command:
    argv:
      - kubectl
      - rollout
      - status
      - deployment/argocd-repo-server
      - "--namespace={{ argocd_namespace }}"
      - --timeout=300s
  changed_when: false

- name: Wait for Argo CD application controller
  ansible.builtin.command:
    argv:
      - kubectl
      - rollout
      - status
      - statefulset/argocd-application-controller
      - "--namespace={{ argocd_namespace }}"
      - --timeout=300s
  changed_when: false

# ------------------------------------------------------------
# Dashboard Ingress
# ------------------------------------------------------------

- name: Configure Argo CD dashboard ingress
  kubernetes.core.k8s:
    state: present
    src: "{{ argocd_ingress_manifest }}"

# ------------------------------------------------------------
# Register GitOps Applications
# ------------------------------------------------------------

- name: Register monitoring application with Argo CD
  kubernetes.core.k8s:
    state: present
    src: "{{ argocd_monitoring_application_manifest }}"

- name: Register Python application with Argo CD
  kubernetes.core.k8s:
    state: present
    src: "{{ argocd_application_manifest }}"

# ------------------------------------------------------------
# Verification
# ------------------------------------------------------------

- name: Get registered Argo CD applications
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - applications
      - --namespace
      - "{{ argocd_namespace }}"
  register: argocd_applications
  changed_when: false

- name: Display registered Argo CD applications
  ansible.builtin.debug:
    var: argocd_applications.stdout_lines
