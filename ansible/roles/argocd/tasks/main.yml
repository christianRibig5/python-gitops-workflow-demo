- name: Verify AWS authentication
  ansible.builtin.command:
    cmd: aws sts get-caller-identity --profile {{ aws_profile }}
  changed_when: false

- name: Update EKS kubeconfig
  ansible.builtin.command:
    cmd: >
      aws eks update-kubeconfig
      --region {{ aws_region }}
      --name {{ eks_cluster_name }}
      --profile {{ aws_profile }}
  changed_when: true

- name: Confirm access to EKS worker nodes
  ansible.builtin.command:
    cmd: kubectl get nodes
  register: eks_nodes
  changed_when: false

- name: Display EKS nodes
  ansible.builtin.debug:
    var: eks_nodes.stdout_lines

- name: Create Argo CD namespace
  kubernetes.core.k8s:
    name: "{{ argocd_namespace }}"
    api_version: v1
    kind: Namespace
    state: present

- name: Install Argo CD
  ansible.builtin.command:
    cmd: >
      kubectl apply
      --namespace {{ argocd_namespace }}
      --server-side
      --force-conflicts
      --filename
      https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml
  register: argocd_install
  changed_when: >
    'created' in argocd_install.stdout or
    'configured' in argocd_install.stdout or
    'serverside-applied' in argocd_install.stdout

- name: Wait for Argo CD to become ready
  ansible.builtin.command:
    cmd: >
      kubectl rollout status deployment
      --all
      --namespace {{ argocd_namespace }}
      --timeout=600s
  changed_when: false

- name: Register application with Argo CD
  kubernetes.core.k8s:
    state: present
    namespace: "{{ argocd_namespace }}"
    src: "../argocd/application.yaml"

- name: Retrieve initial Argo CD password
  ansible.builtin.command:
    cmd: >
      kubectl get secret argocd-initial-admin-secret
      --namespace {{ argocd_namespace }}
      --output jsonpath='{.data.password}'
  register: argocd_password_encoded
  changed_when: false
  no_log: true

- name: Decode Argo CD password
  ansible.builtin.set_fact:
    argocd_password: "{{ argocd_password_encoded.stdout | b64decode }}"
  no_log: true

- name: Display login information
  ansible.builtin.debug:
    msg:
      - "Username: admin"
      - "Password: {{ argocd_password }}"
      - "After the playbook finishes, run:"
      - "kubectl port-forward service/argocd-server -n argocd 8080:443"
      - "Then open: https://localhost:8080"
