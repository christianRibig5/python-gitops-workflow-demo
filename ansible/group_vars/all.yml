---
# ============================================================
# Python GitOps Workflow Demo
# Project-level Ansible variables
# ============================================================

# ------------------------------------------------------------
# Project
# ------------------------------------------------------------

project_name: python-gitops-workflow-demo

# Repository root.
#
# project-up.yml and project-down.yml live under:
#   ansible/playbooks/
#
# Therefore ../.. resolves to the repository root.
project_root: "{{ playbook_dir }}/../.."

# ------------------------------------------------------------
# AWS
# ------------------------------------------------------------

aws_region: ca-central-1
aws_profile: dev-admin

# Shared EKS cluster created by the reusable aws-lab.
#
# The project lifecycle consumes this cluster but does not
# create or destroy it.
eks_cluster_name: retail-dev-eksjalexsol

# ------------------------------------------------------------
# Kubernetes
# ------------------------------------------------------------

monitoring_namespace: monitoring
argocd_namespace: argocd

# ------------------------------------------------------------
# Argo CD
# ------------------------------------------------------------

# Pin Argo CD for reproducible project deployments.
argocd_version: v3.5.3

# Project manifests consumed by the Argo CD Ansible role.
argocd_ingress_manifest: "{{ project_root }}/argocd/argocd-ingress.yaml"

argocd_monitoring_application_manifest: "{{ project_root }}/argocd/monitoring-application.yaml"

argocd_application_manifest: "{{ project_root }}/argocd/application.yaml"

# ------------------------------------------------------------
# Project-specific Terraform
#
# IMPORTANT:
# Order matters because later components consume resources
# created by earlier components.
#
# project-up:
#   Processes this list from top to bottom.
#
# project-down:
#   Destroys ONLY ephemeral Pod Identity components.
#
# KMS and Secrets Manager resources are intentionally
# preserved during project-down so existing credentials can
# be reused when the project comes back up.
# ------------------------------------------------------------

terraform_components:
  # ==========================================================
  # 1. MONITORING KMS
  #
  # Customer-managed KMS key used to encrypt project
  # monitoring secrets.
  #
  # Persistent across project-down/project-up cycles.
  # ==========================================================

  - name: monitoring-kms
    path: "{{ project_root }}/terraform/monitoring-kms"

  # ==========================================================
  # 2. SECRETS MANAGER
  #
  # These resources depend on the monitoring KMS key.
  #
  # Terraform manages the secret containers only.
  # Secret values are populated separately and are therefore
  # not stored in Terraform state.
  #
  # Persistent across project-down/project-up cycles.
  # ==========================================================

  - name: grafana-admin-secret
    path: "{{ project_root }}/terraform/grafana-admin-secret"

  - name: alertmanager-zoho-secret
    path: "{{ project_root }}/terraform/alertmanager-zoho-secret"

  - name: prometheus-grafana-cloud-secret
    path: "{{ project_root }}/terraform/prometheus-grafana-cloud-secret"

  # ==========================================================
  # 3. EKS POD IDENTITY
  #
  # IAM roles, IAM policies and EKS Pod Identity associations.
  #
  # These are disposable project runtime infrastructure:
  #
  #   project-up   -> creates/reconciles them
  #   project-down -> destroys them
  #
  # Existing Secrets Manager values remain untouched.
  # ==========================================================

  - name: grafana-pod-identity
    path: "{{ project_root }}/terraform/pod-identity-associations/grafana-pod-identity-association"

  - name: alertmanager-pod-identity
    path: "{{ project_root }}/terraform/pod-identity-associations/alertmanager-pod-identity-association"

  - name: prometheus-pod-identity
    path: "{{ project_root }}/terraform/pod-identity-associations/prometheus-pod-identity-association"
