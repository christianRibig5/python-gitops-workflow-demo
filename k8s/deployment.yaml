apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-demo
  namespace: python-gitops
  labels:
    app.kubernetes.io/name: gitopsdemo
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # The current EKS nodes are at their Pod limit, so replace one Pod at a
      # time instead of requiring an additional surge Pod during rollouts.
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gitopsdemo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitopsdemo
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "5000"
    spec:
      serviceAccountName: gitopsdemo-sa
      containers:
        - name: gitopsdemo
          image: conyeukwu25/gitops-demo:1341883
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
