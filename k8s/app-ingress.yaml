apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitopsdemo-http-ip-mode
  namespace: python-gitops
  annotations:
    # Dedicated ALB name
    alb.ingress.kubernetes.io/load-balancer-name: gitopsdemo-http-ip-mode

    # ALB configuration
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

    # Frontend Listeners and TLS
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ca-central-1:247332613204:certificate/a9e969eb-41df-41e1-8770-0db426a5aa15

    # Communication from ALB to Python Service
    alb.ingress.kubernetes.io/backend-protocol: HTTP

    # ALB target-group health check
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/success-code: "200"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"

spec:
  ingressClassName: alb
  rules:
    - host: app.vgc247.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitopsdemo-service
                port:
                  number: 80
