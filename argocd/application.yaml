apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: python-gitops-demo
  namespace: argocd
  labels:
    app.kubernetes.io/name: python-gitops-demo
    app.kubernetes.io/part-of: platform
    environment: development

  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/christianRibig5/python-gitops-workflow-demo.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: python-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
