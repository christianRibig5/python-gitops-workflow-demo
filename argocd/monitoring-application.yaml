apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: monitoring
  namespace: argocd

  labels:
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/managed-by: argocd

spec:
  project: default

  # ----------------------------------------------------------
  # Git repository monitored by Argo CD
  # ----------------------------------------------------------
  source:
    repoURL: https://github.com/christianRibig5/python-gitops-workflow-demo.git
    targetRevision: main
    path: monitoring

  # ----------------------------------------------------------
  # Kubernetes deployment destination
  # ----------------------------------------------------------
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  # ----------------------------------------------------------
  # GitOps synchronization policy
  # ----------------------------------------------------------
  syncPolicy:
    automated:
      selfHeal: true

      # Keep pruning disabled for the monitoring stack.
      # Prometheus and Grafana use persistent EBS-backed PVCs,
      # so destructive cleanup should remain deliberate.
      prune: false

    syncOptions:
      # Create the monitoring namespace if it does not yet exist.
      - CreateNamespace=true

      # Apply only resources whose desired state differs from
      # the current cluster state.
      - ApplyOutOfSyncOnly=true

      # Validate manifests against the Kubernetes API.
      - Validate=true

    # Retry temporary synchronization failures.
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Retain previous deployment revisions for rollback/history.
  revisionHistoryLimit: 10
